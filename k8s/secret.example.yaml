# ==============================================================================
# SECRET EXAMPLE FILE -- NEVER COMMIT REAL SECRETS TO VERSION CONTROL!
# Copy this file to secret.yaml (which is gitignored) and insert real credentials.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: llmops-secret
  namespace: llmops
type: Opaque
stringData:
  # Optional Anthropic API Key (if omitted, failover engine routes to keyless MockProvider)
  ANTHROPIC_API_KEY: "your-anthropic-api-key-here"
  
  # Shared PostgreSQL connection string for horizontal statelessness
  # Format: postgresql://<user>:<password>@<host>:<port>/<dbname>
  DATABASE_URL: "postgresql://llmops:llmops123@postgres.llmops.svc.cluster.local:5432/llmops_telemetry"
