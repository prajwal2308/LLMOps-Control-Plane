services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llmops-control-plane
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DB_PATH=/app/data/telemetry.db
    volumes:
      - telemetry-data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: llmops-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  telemetry-data:
